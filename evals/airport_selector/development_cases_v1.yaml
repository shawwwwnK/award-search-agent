# Disclosed development corpus for the M2A endpoint-airport selector.  These
# are resolved catalog entities, not user utterances.  The checks deliberately
# use human-authored envelopes rather than one exact airport list.
contract_version: airport_selector_development_v1
development: true
scenarios:
  - id: paris_city_default_cap
    entity_id: geonames:2988507
    role: origin
    expectations:
      must_consider_any_of: [CDG, ORY]
      acceptable: [CDG, ORY]
      unacceptable: [JFK]
      review_focus: ordinary city; fewer than the two-airport cap is allowed
  - id: london_city_default_cap
    entity_id: geonames:2643743
    role: origin
    expectations:
      must_consider_any_of: [LHR, LGW]
      acceptable: [LHR, LGW, LCY, STN, LTN]
      unacceptable: [JFK]
      review_focus: named future-exception candidate; remains at the city default cap in v1
  - id: san_francisco_city_default_cap
    entity_id: geonames:5391959
    role: origin
    expectations:
      must_consider_any_of: [SFO]
      acceptable: [SFO, OAK, SJC]
      unacceptable: [JFK]
      review_focus: named future-exception candidate; identity-valid but distant choices remain unsuitable
  - id: new_york_city_default_cap
    entity_id: geonames:5128581
    role: origin
    expectations:
      must_consider_any_of: [JFK, EWR, LGA]
      acceptable: [JFK, EWR, LGA]
      unacceptable: [LAX]
      review_focus: named future-exception candidate; remains at the city default cap in v1
  - id: california_admin1_region
    entity_id: geonames:5332921
    role: destination
    expectations:
      must_consider_any_of: [SFO, LAX]
      acceptable: [SFO, LAX, SAN, SJC, OAK]
      unacceptable: [JFK]
      review_focus: sub-country taxonomy; membership evidence is unavailable in the current catalog
  - id: japan_country_default_cap
    entity_id: geonames:1861060
    role: destination
    expectations:
      must_consider_any_of: [HND, NRT]
      acceptable: [HND, NRT, KIX, NGO, FUK, CTS]
      unacceptable: [JFK]
      review_focus: country membership is deterministically checked
  - id: france_country_default_cap
    entity_id: geonames:3017382
    role: destination
    expectations:
      must_consider_any_of: [CDG, ORY]
      acceptable: [CDG, ORY, LYS, NCE, MRS]
      unacceptable: [JFK]
      review_focus: ordinary country; geographic coverage is a human review criterion
  - id: united_states_country_default_cap
    entity_id: geonames:6252001
    role: destination
    expectations:
      must_consider_any_of: [JFK, LAX, ORD, DFW, ATL]
      acceptable: [JFK, LAX, ORD, DFW, ATL, SFO, SEA, DEN, IAD, MIA, BOS]
      unacceptable: [YYZ]
      review_focus: named future-exception candidate; remains at country default cap in v1
  - id: china_country_default_cap
    entity_id: geonames:1814991
    role: destination
    expectations:
      must_consider_any_of: [PEK, PKX, PVG, CAN]
      acceptable: [PEK, PKX, PVG, CAN, SZX, CTU, XIY]
      unacceptable: [NRT]
      review_focus: named future-exception candidate; remains at country default cap in v1
  - id: europe_continent
    entity_id: geonames:6255148
    role: destination
    expectations:
      must_consider_any_of: [LHR, CDG, FRA, AMS]
      acceptable: [LHR, CDG, FRA, AMS, MAD, FCO, MUC, ZRH, IST, CPH, ARN]
      unacceptable: [JFK]
      review_focus: international category; a cap of eight is a maximum, not a coverage target
  - id: north_america_continent
    entity_id: geonames:6255149
    role: destination
    expectations:
      must_consider_any_of: [JFK, LAX, ORD, YYZ, MEX]
      acceptable: [JFK, LAX, ORD, YYZ, MEX, DFW, ATL, SFO, YVR, IAH]
      unacceptable: [LHR]
      review_focus: international category; evaluate geographic usefulness manually
  - id: middle_east_geographic_region_fallback
    entity_id: geonames:6269133
    role: destination
    expectations:
      must_consider_any_of: [DXB, DOH, AUH]
      acceptable: [DXB, DOH, AUH, TLV, RUH, JED, AMM, CAI]
      unacceptable: [JFK]
      review_focus: generic geographic-region taxonomy uses explicit broad-cap fallback; membership is unavailable
