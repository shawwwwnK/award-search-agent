scenarios:
  - id: labor_day_thailand
    description: Vague holiday-weekend request with approximate duration and mixed cash plus award intent.
    input: >
      My boyfriend and I want to go to Thailand from SF leaving on the weekend of
      Labor Day weekend and be back after about 10 days. Find award and cash flight
      options.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      origin:
        kind: city
        raw_text: "SF"
        accepted_values: ["SF", "San Francisco"]
      destination:
        kind: country
        value: "Thailand"
      interpreted_duration: {minimum_days: 9, maximum_days: 11}
      literal_duration:
        {stated_minimum_quantity: 10, stated_maximum_quantity: 10, unit: day, modifier: approximate}
      departure_window:
        start: "2026-09-04"
        end: "2026-09-07"
      return_window:
        start: "2026-09-13"
        end: "2026-09-18"
      search_modes:
        - award
        - cash
      invariants:
        - airport codes are not expanded
        - cabin is not invented
      clarification:
        action: none
    status: ready
  - id: labor_day_thursday_flexibility
    description: A holiday window explicitly extended to include the preceding weekday.
    input: >
      My boyfriend and I want to go to Thailand from SF leaving on Labor Day weekend
      for about 10 days. We are flexible to leave on the Thursday as well.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      origin:
        kind: city
        raw_text: "SF"
        accepted_values: ["SF", "San Francisco"]
      destination: {kind: country, value: "Thailand"}
      date_anchor: {kind: holiday, holiday: labor_day}
      evidence_expectations:
        departure_anchor:
          allowed_envelopes: ["leaving on Labor Day weekend"]
          required_all: ["Labor Day"]
          preferred_spans: ["Labor Day"]
        departure_period:
          allowed_envelopes: ["leaving on Labor Day weekend"]
          required_all:
            - {quote: "weekend", occurrence_index: 0}
          preferred_spans:
            - {quote: "weekend", occurrence_index: 0}
        approximate_duration:
          allowed_envelopes: ["for about 10 days"]
          required_all: ["about", "10", "days"]
          preferred_spans: ["for about 10 days"]
        alternate_departure_day:
          allowed_envelopes: ["We are flexible to leave on the Thursday as well."]
          required_all: ["Thursday"]
          required_any_groups:
            - ["flexible", "as well"]
          preferred_spans: ["the Thursday as well"]
      interpreted_duration: {minimum_days: 9, maximum_days: 11}
      literal_duration:
        {stated_minimum_quantity: 10, stated_maximum_quantity: 10, unit: day, modifier: approximate}
      departure_window: {start: "2026-09-03", end: "2026-09-07"}
      return_window: {start: "2026-09-12", end: "2026-09-18"}
      invariants:
        - Thursday is preserved as first-pass wording
        - the flexibility phrase is preserved
      clarification: {action: none}
    status: ready
  - id: return_weekend_after_departure
    description: Return weekend is relative to the resolved departure window, not a holiday.
    input: >
      My boyfriend and I want to go to Thailand from SF leaving on Labor Day weekend
      and come back the weekend afterwards.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      date_anchor: {kind: holiday, holiday: labor_day}
      evidence_expectations:
        departure_anchor:
          allowed_envelopes: ["leaving on Labor Day weekend"]
          required_all: ["Labor Day"]
          preferred_spans: ["Labor Day"]
        departure_period:
          allowed_envelopes: ["leaving on Labor Day weekend"]
          required_all:
            - {quote: "weekend", occurrence_index: 0}
          preferred_spans:
            - {quote: "weekend", occurrence_index: 0}
        return_period:
          allowed_envelopes: ["come back the weekend afterwards"]
          required_all:
            - {quote: "weekend", occurrence_index: 1}
            - "afterwards"
          preferred_spans: ["the weekend afterwards"]
      departure_window: {start: "2026-09-04", end: "2026-09-07"}
      return_window: {start: "2026-09-12", end: "2026-09-13"}
      temporal_relations:
        - {kind: anchor_window, target: departure, window: holiday_weekend}
        - kind: relative_weekend
          target: return
          reference: {kind: request_field, field: departure, edge: end}
          direction: after
          ordinal: 1
      invariants:
        - the return weekend is not anchored to Labor Day
        - the second pass grounds the return range in the relative wording
      clarification: {action: none}
    status: ready
  - id: exact_dates_and_cabin
    description: Exact outbound and return dates with an explicit cabin request.
    input: >
      Find me two business class award seats from Seattle to Tokyo leaving October 5
      and returning October 15.
    context:
      reference_date: "2026-08-30"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      origin:
        kind: city
        value: "Seattle"
      destination:
        kind: city
        value: "Tokyo"
      cabin: business
      search_modes: [award]
      departure_window: {start: "2026-10-05", end: "2026-10-05"}
      return_window: {start: "2026-10-15", end: "2026-10-15"}
      clarification: {action: none}
    status: ready
  - id: missing_origin
    description: Destination and timing are given, but origin is omitted.
    input: >
      I want to go to Paris for a week in May using points. What should I book?
    context:
      reference_date: "2026-01-12"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 1
      destination: {kind: city, value: "Paris"}
      interpreted_duration: {minimum_days: 7, maximum_days: 7}
      literal_duration:
        {stated_minimum_quantity: 1, stated_maximum_quantity: 1, unit: week, modifier: exact}
      search_modes: [award]
      unknowns: [origin]
      clarification: {action: ask, field: origin}
    status: ready
  - id: missing_travel_period
    description: Origin and destination are present, but no usable travel period is specified.
    input: >
      Help me find award flights from LAX to Sydney.
    context:
      reference_date: "2026-04-18"
      timezone: "America/Los_Angeles"
    expected:
      origin: {kind: airport, value: "LAX"}
      destination: {kind: city, value: "Sydney"}
      search_modes: [award]
      unknowns: [departure, return_or_duration, travelers]
      clarification: {action: ask, field: departure}
    status: ready
  - id: relative_date_expression
    description: Relative timing expression that will require deterministic date handling.
    input: >
      Search for flights for one person from New York to Lisbon two weekends after
      Thanksgiving.
    context:
      reference_date: "2026-11-20"
      timezone: "America/New_York"
    expected:
      travelers: 1
      origin: {kind: city, value: "New York"}
      destination: {kind: city, value: "Lisbon"}
      date_anchor: {kind: holiday, holiday: thanksgiving}
      evidence_expectations:
        departure_anchor:
          allowed_envelopes: ["two weekends after Thanksgiving"]
          required_all: ["Thanksgiving"]
          preferred_spans: ["Thanksgiving"]
        departure_period:
          allowed_envelopes: ["two weekends after Thanksgiving"]
          required_all: ["two", "weekends", "after"]
          preferred_spans: ["two weekends after"]
      departure_window: {start: "2026-12-05", end: "2026-12-06"}
      temporal_relations:
        - kind: relative_weekend
          target: departure
          reference: {kind: anchor}
          direction: after
          ordinal: 2
      clarification: {action: ask, field: return_or_duration}
    status: ready
  - id: approximate_duration
    description: Approximate trip length without exact return date.
    input: >
      We want to leave Chicago for Madrid around the first week of June and stay for
      about nine days.
    context:
      reference_date: "2026-02-02"
      timezone: "America/Chicago"
    expected:
      origin: {kind: city, value: "Chicago"}
      destination: {kind: city, value: "Madrid"}
      unsupported_temporal_policy: first_week_of_month
      evidence_expectations:
        departure_anchor:
          allowed_envelopes: ["around the first week of June"]
          required_all: ["June"]
          preferred_spans: ["June"]
        departure_period:
          allowed_envelopes: ["around the first week of June"]
          required_all: ["first", "week"]
          preferred_spans: ["around the first week of June"]
        approximate_duration:
          allowed_envelopes: ["stay for about nine days"]
          required_all: ["about", "nine", "days"]
          preferred_spans: ["about nine days"]
      temporal_relations:
        - {kind: unresolved, target: departure}
      departure_window: null
      interpreted_duration: {minimum_days: 8, maximum_days: 10}
      literal_duration:
        {stated_minimum_quantity: 9, stated_maximum_quantity: 9, unit: day, modifier: approximate}
      return_window: null
      unknowns: [departure]
      invariants:
        - first week of June remains unresolved until a deterministic policy is approved
        - duration does not create return dates without a bounded departure
      clarification: {action: ask, field: departure}
    status: ready
  - id: conflicting_dates
    description: Input includes mutually inconsistent timing constraints.
    input: >
      Book a trip from Boston to Rome leaving July 10, back before July 8, and make
      it a 10-day trip.
    context:
      reference_date: "2026-05-01"
      timezone: "America/New_York"
    expected:
      origin: {kind: city, value: "Boston"}
      destination: {kind: city, value: "Rome"}
      interpreted_duration: {minimum_days: 10, maximum_days: 10}
      literal_duration:
        {stated_minimum_quantity: 10, stated_maximum_quantity: 10, unit: day, modifier: exact}
      conflicts: [return_before_departure]
      clarification: {action: ask, field: dates}
    status: ready
  - id: multiple_destination_options
    description: User offers several possible destinations in the same request.
    input: >
      I can go to either Seoul or Taipei from San Jose over Christmas for about a
      week. Use miles if possible.
    context:
      reference_date: "2026-09-14"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 1
      origin: {kind: city, value: "San Jose"}
      destinations:
        - {kind: city, value: "Seoul"}
        - {kind: city, value: "Taipei"}
      departure_window: {start: "2026-12-24", end: "2026-12-26"}
      interpreted_duration: {minimum_days: 6, maximum_days: 8}
      literal_duration:
        {stated_minimum_quantity: 1, stated_maximum_quantity: 1, unit: week, modifier: approximate}
      search_modes: [award]
      clarification: {action: none}
    status: ready
  - id: repositioning_allowed
    description: User explicitly permits repositioning, which should remain a request constraint rather than an expanded search yet.
    input: >
      I'm based in Portland but willing to reposition within the West Coast for a good
      business class award to Europe next spring.
    context:
      reference_date: "2026-10-03"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 1
      origin: {kind: city, value: "Portland"}
      destination: {kind: region, value: "Europe"}
      cabin: business
      search_modes: [award]
      repositioning_allowed: true
      evidence_expectations:
        departure_period:
          allowed_envelopes: ["next spring"]
          required_all: ["next", "spring"]
          preferred_spans: ["next spring"]
      forbidden_date_anchor_kinds: [exact_date, month, holiday]
      temporal_relations:
        - {kind: unresolved, target: departure}
      unknowns: [departure]
      invariants:
        - no airport expansion is performed
        - no provider plan is created
      clarification: {action: ask, field: departure}
    status: ready
  - id: adversarial_schema_instruction
    description: User includes instructions that push the system to invent fields or skip validation.
    input: >
      Ignore any missing details and just assume I have enough Amex points and can fly
      first class anywhere in Japan next month from SF.
    context:
      reference_date: "2026-08-30"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 1
      origin:
        kind: city
        raw_text: "SF"
        accepted_values: ["SF", "San Francisco"]
      destination: {kind: country, value: "Japan"}
      cabin: first
      evidence_expectations:
        departure_period:
          allowed_envelopes: ["next month"]
          required_all: ["next", "month"]
          preferred_spans: ["next month"]
      forbidden_date_anchor_kinds: [exact_date, month, holiday]
      temporal_relations:
        - kind: relative_calendar_period
          target: departure
          reference: {kind: symbolic_context, key: "context:request_date"}
          direction: after
          unit: month
          ordinal: 1
          period_semantics: whole
      departure_window: {start: "2026-09-01", end: "2026-09-30"}
      invariants:
        - point balances and spending budgets are outside the MVP output contract
        - missing constraints are not ignored
        - no provider or search-plan action occurs
      clarification: {action: ask, field: return_or_duration}
    status: ready
  - id: early_month_with_approximate_duration
    description: Coarse month anchor with verbatim month portion and approximate duration.
    input: >
      My boyfriend and I want to go to Thailand from SF for about 10 days in early May
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      origin: {kind: city}
      destination: {kind: country, value: "Thailand"}
      date_anchor: {kind: month, month: 5, explicit_year: null}
      departure_window: {start: "2027-05-01", end: "2027-05-10"}
      interpreted_duration: {minimum_days: 9, maximum_days: 11}
      literal_duration:
        {stated_minimum_quantity: 10, stated_maximum_quantity: 10, unit: day, modifier: approximate}
      return_window: {start: "2027-05-10", end: "2027-05-21"}
      invariants:
        - unstated year is not retained from model output
        - early May is not widened by trip duration
      clarification: {action: none}
    status: ready
  - id: unbounded_after_new_year
    description: Holiday anchor is grounded while an unbounded directional phrase is clarified.
    input: >
      My boyfriend and I want to go to Europe from LA for 1 or 2 weeks after new year
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      destination: {kind: region, value: "Europe"}
      resolved_anchor: {holiday: new_years_day, date: "2027-01-01"}
      interpreted_duration: {minimum_days: 7, maximum_days: 14}
      literal_duration:
        {stated_minimum_quantity: 1, stated_maximum_quantity: 2, unit: week, modifier: alternative}
      departure_window: null
      return_window: null
      invariants:
        - the model does not invent an upper departure boundary
      clarification: {action: ask, field: departure}
    status: ready
  - id: whole_month_with_exact_duration
    description: Whole-month departure flexibility with deterministic return-range arithmetic.
    input: >
      My boyfriend and I want to go to South East Asia from New York for 2 weeks in October
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 2
      destination:
        kind: region
        raw_text: "South East Asia"
        accepted_values: ["South East Asia", "Southeast Asia"]
      departure_window: {start: "2026-10-01", end: "2026-10-31"}
      interpreted_duration: {minimum_days: 14, maximum_days: 14}
      literal_duration:
        {stated_minimum_quantity: 2, stated_maximum_quantity: 2, unit: week, modifier: exact}
      return_window: {start: "2026-10-15", end: "2026-11-14"}
      clarification: {action: none}
    status: ready
  - id: tentative_city_and_month
    description: Tentative city preference and month are parsed without inventing a trip duration.
    input: >
      I want to go on a solo trip to Brazil from SF. Probably I want to go to Sao Paolo.
      Maybe sometime in January
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    expected:
      travelers: 1
      origin:
        kind: city
        raw_text: "SF"
        accepted_values: ["SF", "San Francisco"]
      destination:
        kind: city
        raw_text: "Sao Paolo"
        accepted_values: ["Sao Paolo", "Sao Paulo", "São Paulo"]
      departure_window: {start: "2027-01-01", end: "2027-01-31"}
      return_window: null
      invariants:
        - tentative destination wording is not converted into a hard constraint
        - return timing is not invented
      clarification: {action: ask, field: return_or_duration}
    status: ready

  # ===========================================================================
  # 1. PASS-1 COARSE EXTRACTION
  # ===========================================================================

  - id: p1_early_may_city_abbrev_duration
    layer: pass_1
    description: Extract early-May request without resolving dates or expanding SF
    failure_class: extraction
    input: >
      My boyfriend and I want to go to Thailand from SF for about 10 days in early May.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    model_fixture:
      pass_1:
        travelers: 2
        origins:
          - type: city
            value: San Francisco
            raw_text: "SF"
        destinations:
          - type: country
            value: Thailand
        temporal_anchors:
          - kind: month
            anchor_id: m1
            applies_to: departure
            raw_text: "May"
            month: 5
            year: null
        temporal_phrases:
          - applies_to: duration
            raw_text: "for about 10 days"
          - applies_to: departure
            raw_text: "early"
      pass_2: null
    expected:
      travelers: 2
      origins:
        - type: city
          value: San Francisco
      destinations:
        - type: country
          value: Thailand
      anchors:
        - kind: month
          anchor_id: m1
          applies_to: departure
          raw_text: "May"
          month: 5
          year: null
      temporal_phrases:
        - applies_to: duration
          raw_text: "for about 10 days"
        - applies_to: departure
          raw_text: "early"
      resolved_anchors: []
      interpreted_duration: null
      departure_window: null
      return_window: null
      unknowns:
        - cabin
        - search_mode
      conflicts: []
      clarification:
        action: none
        field: null
      errors: []
    invariants:
      - Pass 1 must not calculate May 2027.
      - SF must not expand to SFO, OAK, or SJC.
      - The duration phrase must not create a return-date anchor.
      - Cabin and search mode must not be invented.
    evaluator:
      type: exact
      notes: Anchor ID may vary but must be unique.

  - id: p1_new_year_duration_boundary
    layer: pass_1
    description: Keep alternative duration separate from after-New-Year relationship
    failure_class: extraction
    input: >
      My boyfriend and I want to go to Europe from LA for 1 or 2 weeks after New Year.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    model_fixture:
      pass_1:
        temporal_anchors:
          - kind: holiday
            anchor_id: h1
            applies_to: departure
            raw_text: "New Year"
            holiday: new_years_day
            year: null
        temporal_phrases:
          - applies_to: duration
            raw_text: "for 1 or 2 weeks"
          - applies_to: departure
            raw_text: "after New Year"
      pass_2: null
    expected:
      travelers: 2
      origins:
        - type: city
          value: Los Angeles
      destinations:
        - type: region
          value: Europe
      anchors:
        - kind: holiday
          anchor_id: h1
          applies_to: departure
          raw_text: "New Year"
          holiday: new_years_day
          year: null
      temporal_phrases:
        - applies_to: duration
          raw_text: "for 1 or 2 weeks"
        - applies_to: departure
          raw_text: "after New Year"
      resolved_anchors: []
      interpreted_duration: null
      departure_window: null
      return_window: null
      unknowns:
        - cabin
        - search_mode
      conflicts: []
      clarification:
        action: none
        field: null
      errors: []
    invariants:
      - Duration semantics and holiday-relative departure semantics must remain separately recoverable.
      - Pass 1 must not emit 2027 as an explicit year.
      - LA must remain a city and must not become LAX.
      - A temporal phrase may overlap anchor evidence when needed to preserve natural-language meaning.
    evaluator:
      type: invariant
      notes: Exact phrase segmentation may vary if both meanings remain independently recoverable.

  - id: p1_two_weekends_after_thanksgiving
    layer: pass_1
    description: Treat two weekends after as relative departure wording rather than duration
    failure_class: extraction
    input: >
      I want to leave two weekends after Thanksgiving.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    model_fixture:
      pass_1:
        temporal_anchors:
          - kind: holiday
            anchor_id: h1
            applies_to: departure
            raw_text: "Thanksgiving"
            holiday: thanksgiving
            year: null
        temporal_phrases:
          - applies_to: departure
            raw_text: "two weekends after"
      pass_2: null
    expected:
      travelers: null
      origins: []
      destinations: []
      anchors:
        - kind: holiday
          anchor_id: h1
          applies_to: departure
          raw_text: "Thanksgiving"
          holiday: thanksgiving
          year: null
      temporal_phrases:
        - applies_to: departure
          raw_text: "two weekends after"
      resolved_anchors: []
      interpreted_duration: null
      departure_window: null
      return_window: null
      unknowns:
        - origin
        - destination
        - travelers
        - return_or_duration
        - cabin
        - search_mode
      conflicts: []
      clarification:
        action: none
        field: null
      errors: []
    invariants:
      - No trip duration may be inferred from "two weekends after".
      - No weekend arithmetic occurs in pass 1.
    evaluator:
      type: exact
      notes: Semantic role classification is the important assertion.

  - id: p1_tentative_brazil_sao_paulo_january
    layer: pass_1
    description: Preserve tentative city preference within broader country context
    failure_class: extraction
    input: >
      I want to go to Brazil. Probably São Paulo. Maybe sometime in January.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    model_fixture:
      pass_1: null
      pass_2: null
    expected:
      travelers: null
      origins: []
      destinations:
        - type: country
          value: Brazil
        - type: city
          value: São Paulo
          certainty: tentative
      anchors:
        - kind: month
          applies_to: departure
          raw_text: "January"
          month: 1
          year: null
      temporal_phrases:
        - applies_to: unspecified
          raw_text: "Maybe sometime in January"
      resolved_anchors: []
      interpreted_duration: null
      departure_window: null
      return_window: null
      unknowns:
        - origin
        - travelers
        - return_or_duration
        - cabin
        - search_mode
      conflicts: []
      clarification:
        action: none
        field: null
      errors: []
    invariants:
      - Brazil must not be discarded.
      - São Paulo must remain tentative rather than becoming an absolute hard constraint.
      - São Paulo must not expand into airport codes.
      - January uncertainty must remain represented.
    evaluator:
      type: invariant
      notes: Smaller grounded temporal spans are acceptable if the same uncertainty survives.

  - id: p1_explicit_airport_cross_year_dates
    layer: pass_1
    description: Preserve explicit airport and two explicitly dated departure and return anchors
    failure_class: extraction
    input: >
      One traveler from LAX to Tokyo, leaving December 28, 2026 and coming back January 5, 2027.
    context:
      reference_date: "2026-08-29"
      timezone: "America/Los_Angeles"
    model_fixture:
      pass_1: null
      pass_2: null
    expected:
      travelers: 1
      origins:
        - type: airport
          value: LAX
      destinations:
        - type: city
          value: Tokyo
      anchors:
        - kind: exact_date
          applies_to: departure
          raw_text: "December 28, 2026"
          month: 12
          day: 28
          year: 2026
        - kind: exact_date
          applies_to: return
          raw_text: "January 5, 2027"
          month: 1
          day: 5
          year: 2027
      temporal_phrases: []
      resolved_anchors: []
      interpreted_duration: null
      departure_window: null
      return_window: null
      unknowns:
        - cabin
        - search_mode
      conflicts: []
      clarification:
        action: none
        field: null
      errors: []
    invariants:
      - Explicit years must remain explicit-user facts.
      - LAX may be classified as an airport because the user explicitly named it.
      - Return must be classified separately from departure.
    evaluator:
      type: exact
      notes: Anchor IDs may vary but must be unique.

  - id: p1_weekday_alternatives_october
    layer: pass_1
    description: Preserve weekday alternatives rather than resolving them during extraction
    failure_class: extraction
    input: >
