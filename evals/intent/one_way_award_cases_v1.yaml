contract_version: one_way_award_v1
purpose: >
  Active live qualification cases for the one-way award request boundary. Historical
  round-trip corpus and baseline artifacts remain in their existing locations and are
  not comparable to this contract.
scenarios:
  - id: one_way_ready_exact_airports
    description: A complete one-way award request becomes ready with no unsupported parts.
    input: Find two business award seats from SFO to BKK on October 5.
    context: {reference_date: "2026-08-30", timezone: "America/Los_Angeles"}
    expected:
      travelers: 2
      origin: {kind: airport, value: SFO}
      destination: {kind: airport, value: BKK}
      cabin: business
      search_modes: [award]
      departure_window: {start: "2026-10-05", end: "2026-10-05"}
      unsupported_request_parts: []
      clarification: {action: none}
    status: ready

  - id: one_way_ready_holiday_window
    description: Existing bounded outbound holiday handling remains in scope for a one-way request.
    input: I need one award seat from Seattle to Tokyo over Labor Day weekend.
    context: {reference_date: "2026-08-29", timezone: "America/Los_Angeles"}
    expected:
      travelers: 1
      origin: {kind: city, value: Seattle}
      destination: {kind: city, value: Tokyo}
      search_modes: [award]
      departure_window: {start: "2026-09-04", end: "2026-09-07"}
      unsupported_request_parts: []
      clarification: {action: none}
    status: ready

  - id: one_way_missing_outbound_requirements
    description: One-way readiness requires outbound timing and travelers, but not return timing.
    input: Find award flights from LAX to Sydney.
    context: {reference_date: "2026-04-18", timezone: "America/Los_Angeles"}
    expected:
      origin: {kind: airport, value: LAX}
      destination: {kind: city, value: Sydney}
      search_modes: [award]
      unknowns: [departure, travelers]
      unsupported_request_parts: []
      clarification: {action: ask, field: departure}
    status: ready

  - id: one_way_missing_origin
    description: The active blocker order starts with origin and does not require a trip length.
    input: Find one award seat to Paris on May 10.
    context: {reference_date: "2026-01-12", timezone: "America/Los_Angeles"}
    expected:
      travelers: 1
      destination: {kind: city, value: Paris}
      departure_window: {start: "2026-05-10", end: "2026-05-10"}
      search_modes: [award]
      unknowns: [origin]
      unsupported_request_parts: []
      clarification: {action: ask, field: origin}
    status: ready

  - id: initial_return_is_unsupported
    description: A return date produces a one-way-scope outcome instead of a round-trip request.
    input: Find two business award seats from Seattle to Tokyo leaving October 5 and returning October 15.
    context: {reference_date: "2026-08-30", timezone: "America/Los_Angeles"}
    expected:
      travelers: 2
      origin: {kind: city, value: Seattle}
      destination: {kind: city, value: Tokyo}
      cabin: business
      search_modes: [award]
      departure_window: {start: "2026-10-05", end: "2026-10-05"}
      unsupported_request_parts: [return_or_duration_not_supported]
      clarification:
        action: unsupported
        field: one_way_award_scope
        reason: return_or_duration_not_supported
    status: ready

  - id: initial_duration_is_unsupported
    description: A trip duration produces the same scope outcome and is never compiled into a return date.
    input: Find one award seat from SFO to BKK on October 5 for ten days.
    context: {reference_date: "2026-08-30", timezone: "America/Los_Angeles"}
    expected:
      travelers: 1
      origin: {kind: airport, value: SFO}
      destination: {kind: airport, value: BKK}
      search_modes: [award]
      departure_window: {start: "2026-10-05", end: "2026-10-05"}
      unsupported_request_parts: [return_or_duration_not_supported]
      clarification:
        action: unsupported
        field: one_way_award_scope
        reason: return_or_duration_not_supported
    status: ready

  - id: cash_only_is_unsupported
    description: Cash-only requests fail at the initial one-way award boundary.
    input: Find one cash flight from SFO to BKK on October 5.
    context: {reference_date: "2026-08-30", timezone: "America/Los_Angeles"}
    expected:
      travelers: 1
      origin: {kind: airport, value: SFO}
      destination: {kind: airport, value: BKK}
      search_modes: [cash]
      departure_window: {start: "2026-10-05", end: "2026-10-05"}
      unsupported_request_parts: [cash_only_not_supported]
      clarification:
        action: unsupported
        field: one_way_award_scope
        reason: cash_only_not_supported
    status: ready

  - id: award_and_cash_remains_award_eligible
    description: Mixed requests remain eligible for the award workflow; cash comparison is deferred.
    input: Find one award and cash flight from SFO to BKK on October 5.
    context: {reference_date: "2026-08-30", timezone: "America/Los_Angeles"}
    expected:
      travelers: 1
      origin: {kind: airport, value: SFO}
      destination: {kind: airport, value: BKK}
      search_modes: [award, cash]
      departure_window: {start: "2026-10-05", end: "2026-10-05"}
      unsupported_request_parts: []
      clarification: {action: none}
    status: ready
