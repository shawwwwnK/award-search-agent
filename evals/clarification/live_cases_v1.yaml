contract_version: v1
# Synthetic answers only. The live evaluator never sends offline scripted amendments.
scenarios:
  - id: numbered_next_weekend_afterwards_and_solo
    qualification_target: true
    reference_date: "2026-09-09"
    initial_origin: SFO
    initial_destination: NRT
    initial_unknowns: [departure, return_or_duration, travelers]
    turns:
      - text: |-
          1. Next weekend
          2. The Wednesday afterwards
          3. Just myself
        expect: {status: ready, blockers: [], fields: {departure: "2026-09-19", return: "2026-09-23", travelers: 1}}
  - id: numbered_next_friday_and_date_and_solo
    qualification_target: true
    reference_date: "2026-09-09"
    initial_origin: SFO
    initial_destination: NRT
    initial_unknowns: [departure, return_or_duration, travelers]
    turns:
      - text: |-
          1. Next Friday
          2. 9/20
          3. Just myself
        expect: {status: ready, blockers: [], fields: {departure: "2026-09-18", return: "2026-09-20", travelers: 1}}
  - id: numbered_this_weekend_and_monday
    reference_date: "2026-09-09"
    initial_origin: SFO
    initial_destination: NRT
    initial_travelers: 2
    initial_unknowns: [departure, return_or_duration]
    turns:
      - text: |-
          1. This weekend
          2. On Monday
        expect: {status: ready, blockers: [], fields: {departure: "2026-09-12", return: "2026-09-14"}}
  - id: ambiguous_disjunctive_relative_dates
    reference_date: "2026-09-09"
    initial_origin: SFO
    initial_destination: NRT
    initial_travelers: 2
    initial_unknowns: [departure, return_or_duration]
    turns:
      - text: "Either this Friday or on Monday works for me"
        expect: {status: awaiting_answer, blockers: [departure, return_or_duration]}
      - text: "Leave this Friday and return on Monday"
        expect: {status: ready, blockers: [], fields: {departure: "2026-09-11", return: "2026-09-14"}}
  - id: origin_only
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_travelers: 2
    initial_unknowns: [origin]
    turns:
      - text: "SFO"
        expect: {status: ready, blockers: [], fields: {origin: SFO}}
  - id: destination_only
    initial_origin: SFO
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_travelers: 2
    initial_unknowns: [destination]
    turns:
      - text: "NRT"
        expect: {status: ready, blockers: [], fields: {destination: NRT}}
  - id: travelers_only
    initial_origin: SFO
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_unknowns: [travelers]
    turns:
      - text: "two travelers"
        expect: {status: ready, blockers: [], fields: {travelers: 2}}
  - id: departure_only
    blind_target: true
    qualification_target: true
    initial_origin: SFO
    initial_destination: NRT
    initial_duration_days: 10
    initial_travelers: 2
    initial_unknowns: [departure]
    turns:
      - text: "I am leaning toward leaving Wednesday of next week, if that works for you"
        expect: {status: ready, blockers: [], fields: {departure: "2026-09-16", return: "2026-09-26"}}
  - id: duration_only
    initial_origin: SFO
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_travelers: 2
    initial_unknowns: [return_or_duration]
    turns:
      - text: "10 days"
        expect: {status: ready, blockers: [], fields: {duration_days: 10, return: "2026-10-16"}}
  - id: all_at_once
    initial_unknowns: [origin, destination, departure, return_or_duration, travelers]
    turns:
      - text: "from SFO to NRT, leave the weekend after this one, return the following Wednesday, two travelers"
        expect: {status: ready, blockers: [], fields: {origin: SFO, destination: NRT, departure: "2026-09-19", return: "2026-09-23", travelers: 2}}
  - id: subset_two_turn
    initial_unknowns: [origin, destination, departure, return_or_duration, travelers]
    turns:
      - text: "from SFO to NRT, two travelers"
        expect: {status: awaiting_answer, blockers: [departure, return_or_duration]}
      - text: "leave the weekend after this one and return October 16"
        expect: {status: ready, blockers: [], fields: {departure: "2026-09-19", return: "2026-10-16"}}
  - id: bare_date_recovery
    initial_origin: SFO
    initial_destination: NRT
    initial_travelers: 2
    initial_unknowns: [departure, return_or_duration]
    turns:
      - text: "October 6"
        expect: {status: awaiting_answer, blockers: [departure, return_or_duration]}
      - text: "depart October 6 and return October 16"
        expect: {status: ready, blockers: [], fields: {departure: "2026-10-06", return: "2026-10-16"}}
  - id: origin_correction_with_sibling
    initial_origin: SFO
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_unknowns: [travelers]
    turns:
      - text: "Actually change origin to LAX, and two travelers"
        expect: {status: ready, blockers: [], fields: {origin: LAX, travelers: 2}}
  - id: departure_correction
    initial_origin: SFO
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_unknowns: [travelers]
    turns:
      - text: "Actually make departure October 8, and two travelers"
        expect: {status: ready, blockers: [], fields: {departure: "2026-10-08", return: "2026-10-18", travelers: 2}}
  - id: no_progress_limit
    initial_origin: SFO
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_unknowns: [travelers]
    turns:
      - text: "I am not sure yet"
        expect: {status: awaiting_answer, blockers: [travelers]}
      - text: "I still do not know"
        expect: {status: stopped, blockers: [], stop_reason: no_progress_limit}
  - id: cancellation
    initial_origin: SFO
    initial_destination: NRT
    initial_departure: "2026-10-06"
    initial_duration_days: 10
    initial_unknowns: [travelers]
    turns:
      - text: "cancel"
        expect: {status: stopped, blockers: [], stop_reason: cancelled}
