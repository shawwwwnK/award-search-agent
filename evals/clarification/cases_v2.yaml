contract_version: v2
scenarios:
  - id: reported_early_next_month_week
    answer_class: safely_assumable
    initial_destination: France
    initial_unknowns: [origin, departure, return_or_duration, travelers]
    turns:
      - text: "1. SFO\n2. Early next month\n3. For a week\n4. I'm solo traveling"
        amendments:
          - {target: origin, requirements: [origin], fragment: "1. SFO", value: SFO}
          - {target: travelers, requirements: [travelers], fragment: "4. I'm solo traveling", travelers: 1}
        approximations:
          - {handle: a1, fragment: "Early next month", month_reference: next_month}
          - {handle: a4, fragment: "a week"}
        oracle:
          must_resolve: [origin, departure, return_or_duration, travelers]
          must_remain_blocked: []
          protected_fields: [destination]
          permitted_statuses: [ready]
          permitted_semantic_actions: [accept_with_visible_assumption]
          properties: {departure_window: {year: 2026, month: 10, start_day: [1, 3], end_day: [3, 10]}, duration_days: [7, 7]}
          disclosure_required: true
          question_required: false
          forbidden: [generic_repeat]
  - id: beginning_october_open_surface
