    pair_id: month_portion_accept_ask
    pair_role: accept
    initial_origin: SFO
    initial_destination: France
    initial_travelers: 1
    initial_unknowns: [departure, return_or_duration]
    turns:
      - text: "I want to leave during the beginning of October for a week"
        approximations:
