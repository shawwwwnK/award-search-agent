# Disclosed development-only casebook for Milestone 2B grouped gateway
# candidate generation. Endpoint codes are individual catalog airports, not
# city or market aliases. Candidate codes are review aids, never a mechanical
# oracle for the model response.
contract_version: gateway_discovery_development_v3
development_only: true
casebook_id: m2b_gateway_discovery_development_v3
purpose: diagnostic_semantic_review_before_2c_search_plan_compilation

catalog:
  release_id: m1a-3cb7981519612945
  logical_content_sha256: 8066652e581947400badef958916dad9dd641de1a0d423a1a601e0e91bcff1d8
  source_role: endpoint_identity_and_market_classification_only
market_policy:
  policy_version: planning-market-v1
  digest: 4e2d9436659b4123f340b2619a4620f843a53ae198469fe9cde5e312e965285a
  source_role: deterministic_skip_or_generation_gate_only
resolved_outbound_date_context: &outbound_date
  start: "2026-10-05"
  end: "2026-10-07"
  timezone: America/Los_Angeles
  effective_window_precision: day
live_run_defaults:
  model: gpt-5.6-luna
  trials: 2
  max_calls_per_trial: 21
  max_calls_total: 42
  retry_policy: no_retry
  refill_policy: no_refill
  judge_policy: human_review_only

scenarios:
  - id: west_coast_to_paris_multi_origin
    origins: [SFO, LAX, SEA]
    destinations: [CDG]
    outbound_date: *outbound_date
    expected_gate: generation_required
    expected_market_ids: {origin: [us], destination: [europe], union: [europe, us]}
    catalog_endpoints:
      SFO: {airport_id: ourairports:3878, country_code: US, iso_region: US-CA, airport_type: large_airport}
      LAX: {airport_id: ourairports:3632, country_code: US, iso_region: US-CA, airport_type: large_airport}
      SEA: {airport_id: ourairports:3875, country_code: US, iso_region: US-WA, airport_type: large_airport}
      CDG: {airport_id: ourairports:4185, country_code: FR, iso_region: FR-IDF, airport_type: large_airport}
    eligible_not_required_iata_codes: [JFK, ORD]
    review_focus: >-
      Preserve all three useful original departure gateways. JFK and ORD remain
      eligible origin-market intermediate-hub hypotheses when scoped to the
      original origins and CDG, but neither exact airport is required. Review
      complementary search usefulness, narrow applicability, and uncertainty;
      do not treat model output as route or award evidence.

