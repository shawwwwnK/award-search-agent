[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "award-travel-agent"
version = "0.1.0"
description = "Scaffold for an award-travel request-understanding workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
award-intent = "award_agent.cli.intent:main"
award-intent-eval = "award_agent.cli.intent_eval:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
